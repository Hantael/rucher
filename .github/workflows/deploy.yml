name: CI/CD - Deploy Rucher d'Hantael

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Job 1: Deploy to GitHub Pages (Staging/Pre-production on develop)
  deploy-pages:
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Replace Placeholders with Secrets
        run: python .github/scripts/replace_secrets.py
        env:
          RUCHER_PHONE_RAW: ${{ secrets.RUCHER_PHONE_RAW }}
          RUCHER_PHONE_FORMATTED: ${{ secrets.RUCHER_PHONE_FORMATTED }}
          RUCHER_EMAIL: ${{ secrets.RUCHER_EMAIL }}
          RUCHER_STREET: ${{ secrets.RUCHER_STREET }}
          RUCHER_ZIP: ${{ secrets.RUCHER_ZIP }}
          RUCHER_CITY: ${{ secrets.RUCHER_CITY }}
          RUCHER_MAPS_QUERY: ${{ secrets.RUCHER_MAPS_QUERY }}
          RUCHER_SIRET: ${{ secrets.RUCHER_SIRET }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Job 2: Deploy to Infomaniak FTP (Production - with manual approval gate on main)
  deploy-prod-ftp:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Replace Placeholders with Secrets
        run: python .github/scripts/replace_secrets.py
        env:
          RUCHER_PHONE_RAW: ${{ secrets.RUCHER_PHONE_RAW }}
          RUCHER_PHONE_FORMATTED: ${{ secrets.RUCHER_PHONE_FORMATTED }}
          RUCHER_EMAIL: ${{ secrets.RUCHER_EMAIL }}
          RUCHER_STREET: ${{ secrets.RUCHER_STREET }}
          RUCHER_ZIP: ${{ secrets.RUCHER_ZIP }}
          RUCHER_CITY: ${{ secrets.RUCHER_CITY }}
          RUCHER_MAPS_QUERY: ${{ secrets.RUCHER_MAPS_QUERY }}
          RUCHER_SIRET: ${{ secrets.RUCHER_SIRET }}

      - name: Deploy to Infomaniak FTP
        run: python .github/scripts/deploy_ftp.py
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

  # Job 3: Automatically create a Pull Request from develop to main
  create-pr:
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: deploy-pages
    permissions:
      pull-requests: write
    steps:
      - name: Create Pull Request
        run: |
          status_code=$(curl -s -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pulls \
            -d '{"title":"🚀 Production Release - Sync develop to main","head":"develop","base":"main","body":"Cette Pull Request a été générée automatiquement.\n\n### 📝 Instructions\n1. Vérifiez le rendu de pré-production sur **GitHub Pages**.\n2. Si tout est correct, fusionnez cette Pull Request.\n3. La pipeline de production se lancera sur la branche `main` et attendra votre validation finale pour envoyer le site par FTP chez Infomaniak."}')
          
          if [ "$status_code" -eq 201 ]; then
            echo "Pull Request créée avec succès."
          elif [ "$status_code" -eq 422 ]; then
            echo "Une Pull Request existe déjà pour cette branche, aucune action nécessaire."
          else
            echo "Erreur lors de la création de la Pull Request (Code: $status_code)"
            cat response.json
            exit 1
          fi
